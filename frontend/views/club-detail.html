<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/dark-theme.css">
  <title>Club Details - Event Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
    }

    header {
      background: #161b22;
      padding: 14px 24px;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #8fa8ff;
      text-decoration: none;
      margin-left: 16px;
      font-weight: 600;
    }

    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h1,
    h2 {
      margin: 0 0 10px;
    }

    .meta {
      color: #8b949e;
      margin-bottom: 8px;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn.following {
      background: #238636;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .event-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px;
    }

    .event-date {
      color: #8b949e;
      font-size: 13px;
    }

    .empty {
      color: #8b949e;
      padding: 6px 0;
    }
  </style>
</head>

<body>
  <header>
    <strong>Club Details</strong>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/browse-events">Browse Events</a>
      <a href="/profile">Profile</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h1 id="clubName">Loading...</h1>
      <div class="meta" id="clubCategory"></div>
      <p id="clubDescription" class="meta"></p>
      <p id="clubContact" class="meta"></p>
      <p id="clubFollowers" class="meta"></p>
    </div>

    <div class="card">
      <h2>Upcoming Events</h2>
      <div id="upcomingEvents" class="events-grid"></div>
    </div>

    <div class="card">
      <h2>Ongoing Events</h2>
      <div id="ongoingEvents" class="events-grid"></div>
    </div>

    <div class="card">
      <h2>Past Events</h2>
      <div id="pastEvents" class="events-grid"></div>
    </div>
  </div>

  <script>
    const hostname = window.location.hostname;
    const isProduction = hostname !== 'localhost' && hostname !== '127.0.0.1';
    const API_URL = isProduction ? 'https://dass-event-management.onrender.com/api' : 'http://localhost:5000/api';

    const token = localStorage.getItem('token');
    const userType = localStorage.getItem('userType');
    const clubId = window.location.pathname.split('/').pop();

    let isFollowing = false;

    if (!token || userType !== 'participant') {
      window.location.href = '/auth/login?role=participant';
    }

    function renderEvents(containerId, events) {
      const container = document.getElementById(containerId);
      if (!events || events.length === 0) {
        container.innerHTML = '<p class="empty">No events found.</p>';
        return;
      }

      container.innerHTML = events.map(ev => `
        <div class="event-card">
          <h3>${ev.eventName}</h3>
          <p class="event-date">${new Date(ev.eventStartDate).toLocaleString()}</p>
          <p>${ev.eventType || 'Normal'}</p>
        </div>
      `).join('');
    }

    function updateFollowBtn() {
      const btn = document.getElementById('followBtn');
      if (!btn) return;
      btn.textContent = isFollowing ? 'Following ✓' : 'Follow +';
      btn.className = isFollowing ? 'btn following' : 'btn';
    }

    async function loadClub() {
      const response = await fetch(`${API_URL}/events/club/${clubId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        alert('Failed to load club details');
        return;
      }

      const data = await response.json();
      const club = data.club || {};

      document.getElementById('clubName').textContent = club.organizerName || 'Club';
      document.getElementById('clubCategory').textContent = `Category: ${club.category || 'General'}`;
      document.getElementById('clubDescription').textContent = club.description || 'No description available.';
      document.getElementById('clubContact').textContent = `Contact Email: ${club.contactEmail || 'N/A'}`;
      document.getElementById('clubFollowers').textContent = `Followers: ${data.followerCount || 0}`;

      isFollowing = !!data.isFollowing;
      updateFollowBtn();
      renderEvents('upcomingEvents', data.upcomingEvents);
      renderEvents('ongoingEvents', data.ongoingEvents);
      renderEvents('pastEvents', data.pastEvents);
    }

    async function toggleFollow() {
      const response = await fetch(`${API_URL}/participants/follow/${clubId}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        alert('Failed to update follow status');
        return;
      }

      const result = await response.json();
      isFollowing = !!result.isFollowing;
      updateFollowBtn();
      loadClub();
    }

    loadClub();
  </script>

  <script src="/dark-enforcer.js"></script>
  <script src="/toast.js"></script>
</body>

</html>
